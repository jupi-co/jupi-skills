name: validate-marketplace
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: playbook-jupi carries no data layer of its own
        # Replaces the old shared/ byte-parity check: the fork policy ended when
        # playbook-jupi moved its store behind the pb-* MCP tools on the Jupi
        # connector (TECH-547) and deleted its Neon helpers. proactive-jupi keeps
        # its own db.mjs and stays on Neon — the two plugins are now independent.
        run: |
          if grep -rnE 'db\.mjs|playbook\.mjs|ensure-deps|apply-schema|neonConnString' plugins/playbook-jupi/; then
            echo "::error::plugins/playbook-jupi must not reference the deleted Neon helpers — it reads and writes through the pb-* tools on the Jupi connector."
            exit 1
          fi
          echo "playbook-jupi data-layer check OK (no Neon helper references)"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace catalog
        run: claude plugin validate .
      - name: Validate each plugin
        run: |
          for d in plugins/*/; do
            echo "Validating $d"
            claude plugin validate "$d"
          done
